<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyncPad — Real-time Collaborative Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --panel: #11161d;
    --panel-raised: #161c25;
    --border: #232b36;
    --text: #e6edf3;
    --text-dim: #8b95a3;
    --accent: #79c0ff;
    --accent-dim: #1f6feb;
    --online: #7ee787;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px 60px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 14px;
  }

  .logo {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }

  .room-controls {
    display: flex;
    gap: 8px;
    align-items: center;
    font-family: var(--mono);
    font-size: 13px;
  }

  .room-controls input {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 13px;
    width: 130px;
  }

  .room-controls button {
    background: var(--accent-dim);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
  }

  .room-controls button:hover { background: var(--accent); }

  .presence-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }

  .user-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px 4px 8px;
  }

  .user-chip .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--online);
    box-shadow: 0 0 6px var(--online);
  }

  .editor-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-raised);
  }

  .panel-head .label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .sync-status {
    font-family: var(--mono);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .sync-status .sdot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--online);
  }

  textarea#editor {
    width: 100%;
    min-height: 420px;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.7;
    padding: 20px;
    resize: vertical;
    outline: none;
  }

  textarea#editor::placeholder { color: #4d5666; }

  .activity-log {
    margin-top: 18px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    max-height: 120px;
    overflow-y: auto;
  }

  .activity-log .entry {
    padding: 4px 0;
    border-bottom: 1px solid var(--border);
  }

  .activity-log .entry:last-child { border-bottom: none; }

  footer {
    margin-top: 36px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--mono);
  }

  @media (max-width: 640px) {
    header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="logo"><span class="dot"></span>SyncPad</div>
    <div class="room-controls">
      <input type="text" id="usernameInput" placeholder="your name" value="">
      <input type="text" id="roomInput" placeholder="room id" value="main">
      <button onclick="joinRoom()">Join room</button>
    </div>
  </header>

  <div class="presence-bar" id="presenceBar">
    <span>not connected yet</span>
  </div>

  <div class="editor-panel">
    <div class="panel-head">
      <span class="label">shared_document.txt</span>
      <span class="sync-status"><span class="sdot"></span><span id="syncText">synced</span></span>
    </div>
    <textarea id="editor" placeholder="Join a room to start editing together..." disabled></textarea>
  </div>

  <div class="activity-log" id="activityLog"></div>

  <footer>real-time sync via WebSockets &mdash; last-write-wins conflict resolution</footer>

</div>

<script>
const socket = io();
let currentRoom = null;
let currentUsername = null;
let documentVersion = 0;
let isApplyingRemoteUpdate = false;

const editor = document.getElementById('editor');
const presenceBar = document.getElementById('presenceBar');
const syncText = document.getElementById('syncText');
const activityLog = document.getElementById('activityLog');

document.getElementById('usernameInput').value = 'user-' + Math.floor(Math.random() * 1000);

function joinRoom() {
  const username = document.getElementById('usernameInput').value.trim() || 'anonymous';
  const room = document.getElementById('roomInput').value.trim() || 'main';

  currentUsername = username;
  currentRoom = room;

  socket.emit('join_document', { room, username });
  editor.disabled = false;
  editor.placeholder = 'Start typing...';
  logActivity(`You joined room "${room}" as ${username}`);
}

editor.addEventListener('input', () => {
  if (isApplyingRemoteUpdate || !currentRoom) return;

  socket.emit('edit_document', {
    room: currentRoom,
    content: editor.value,
    username: currentUsername,
    version: documentVersion
  });

  syncText.textContent = 'syncing...';
});

socket.on('document_state', (data) => {
  isApplyingRemoteUpdate = true;
  editor.value = data.content;
  documentVersion = data.version;
  isApplyingRemoteUpdate = false;
  renderPresence(data.active_users);
});

socket.on('document_updated', (data) => {
  // Only re-apply content if it wasn't our own edit, or if our version
  // was stale and the server's edit needs to be reflected.
  if (data.editor !== currentUsername) {
    isApplyingRemoteUpdate = true;
    editor.value = data.content;
    isApplyingRemoteUpdate = false;
    logActivity(`${data.editor} made an edit`);
  }
  documentVersion = data.version;
  syncText.textContent = 'synced';

  if (data.stale_edit) {
    logActivity(`Note: ${data.editor}'s edit was based on an older version`);
  }
});

socket.on('user_joined', (data) => {
  renderPresence(data.active_users);
  logActivity(`${data.username} joined the room`);
});

socket.on('user_left', (data) => {
  renderPresence(data.active_users);
  logActivity(`${data.username} left the room`);
});

function renderPresence(users) {
  if (!users || users.length === 0) {
    presenceBar.innerHTML = '<span>no one else here</span>';
    return;
  }
  presenceBar.innerHTML = users.map(u =>
    `<div class="user-chip"><span class="pulse"></span>${escapeHTML(u)}</div>`
  ).join('');
}

function logActivity(text) {
  const entry = document.createElement('div');
  entry.className = 'entry';
  const time = new Date().toLocaleTimeString();
  entry.textContent = `[${time}] ${text}`;
  activityLog.prepend(entry);

  while (activityLog.children.length > 20) {
    activityLog.removeChild(activityLog.lastChild);
  }
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
